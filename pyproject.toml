[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chemiproof"
version = "1.0.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Reproducible research prototype: olive-oil volume fraction from EEM fluorescence, with LOAO evaluation. Not a certified authenticity test."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5,<3",
    "pydantic>=2.14,<3",
    "PyYAML>=6.0,<7",
    "scipy>=1.18,<2",
    "scikit-learn>=1.9,<2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.10,<4"]
ot-reference = ["POT>=0.9.7,<0.10"]  # only for the authors-style reference call and cross-checks
ui = ["streamlit>=1.66,<2", "plotly>=7.1,<8"]  # M6 research explorer (pulls in pandas)
dev = [
    "matplotlib>=3.10,<4",
    "POT>=0.9.7,<0.10",
    "pytest>=9,<10",
    "ruff>=0.17,<0.18",
    "pre-commit>=4.7,<5",
    "streamlit>=1.66,<2",
    "plotly>=7.1,<8",
]

[project.scripts]
chemiproof = "chemiproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "dataset: needs the real Zenodo archive in data/raw/ (never run in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
