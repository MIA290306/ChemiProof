# M2/M3 planned config. Must be validated by actual code; not an executed study.
experiment_id: chemiproof-source-baselines
status: NOT_RUN
run_class: locked      # LOAO-v1 frozen by ADR-013; locked runs need a clean tracked git tree
random_seed: 20261024
mode: inductive
label_unit: fraction
dataset_manifest: data/interim/sample_manifest.csv
outer_cv: leave_one_adulterant_out
inner_cv: leave_one_source_adulterant_out  # inner groups = the 4 source adulterants only
protocol: loao
preprocessing:  # resolved in M2 (ADR-011): prespecified from the authors' code, never tuned on labels
  version: author_v1
  orient_from_axes: true
  baseline_correction: subtract_global_min
  savitzky_golay: {window: 5, polyorder: 2, axes: [emission]}
  intensity_normalization: divide_by_global_max
models:
  - mean_y
  - svr_raw
  - pca_svr
  - pls
metrics: [mae, rmse, bias, r2]
outputs: results/
